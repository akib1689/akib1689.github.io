design:
  theme: engineeringresumes
  # colors:
  #   text: rgb(0,0,0)
  #   name: rgb(0,0,0)
  #   connections: 0077b6
  #   section_titles: rgb(0,0,0)
  #   links: 0077b6
  #   last_updated_date_and_page_numbering: rgb(128,128,128)
  links:
    underline: true
    use_external_link_icon: false
  page:
    size: us-letter
    top_margin: "1cm"
    bottom_margin: "1cm"
    left_margin: "1.2cm"
    right_margin: "1cm"
    show_page_numbering: false
    show_last_updated_date: true
  header:
    name_font_size: "20pt"
    name_bold: false
    # photo_width: "3.5cm"
    vertical_space_between_name_and_connections: "0.5cm"
    vertical_space_between_connections_and_first_section: "0.6cm"
    horizontal_space_between_connections: "0.2cm"
    separator_between_connections: "|"
    use_icons_for_connections: false
    alignment: center
  text:
    font_family: "Open Sans"
    font_size: "10pt"
    leading: "0.6em"
    alignment: justified
    date_and_location_column_alignment: right
  

rendercv_settings:
  render_command: 
    output_folder_name: 'rendercv-output'
    pdf_path: './public/Akibur_Rahman_Resume.pdf'
    dont_generate_markdown: true
    dont_generate_png: true

locale:
  phone_number_format: "international"